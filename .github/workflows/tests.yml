name: tests

# Skip only when every changed path is one no test reads: GitHub runs the
# workflow when any changed path is outside paths-ignore. test_guide reads
# the agt-maintainer skill's SKILL.md, live-check.md and release.md, and the
# .codex link to it, so those still run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.mentor/**'
      - '.kiro/**'
      - '.claude/skills/agt-await-role-job/**'
      - '.claude/skills/agt-maintainer/references/hands-on-check.md'
      - '.codex/skills/agt-await-role-job'
  pull_request:
    paths-ignore:
      - '.mentor/**'
      - '.kiro/**'
      - '.claude/skills/agt-await-role-job/**'
      - '.claude/skills/agt-maintainer/references/hands-on-check.md'
      - '.codex/skills/agt-await-role-job'

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]  # Windows is set aside for now
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: python -m pip install "rich>=14.3.4,<16" "rich-argparse>=1.8,<2"
      - name: Core tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: python -m unittest discover -s tests -t tests -v
